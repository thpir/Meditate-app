name: meditate_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/launcher_icons/
    - assets/images/
    - assets/sounds/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito_regular.ttf
        - asset: assets/fonts/nunito_italic.ttf
          style: italic
        - asset: assets/fonts/nunito_bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "assets/launcher_icons/app_icon_full.png"
  android: true 
  ios: true 
  adaptive_icon_background: "assets/launcher_icons/app_icon_bg.png" 
  adaptive_icon_foreground: "assets/launcher_icons/app_icon_fg.png"
  min_sdk_android: 21 