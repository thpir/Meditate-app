<!doctype html>
<html><head><meta charset="utf-8"><title>Water intake preview</title>
<style>
body{margin:0;background:#ADB2D4;font-family:Nunito,system-ui,sans-serif;color:#24263D}
h1{text-align:center;font-size:22px;margin:24px 0 8px}
p{text-align:center;margin:0 0 16px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,200px);gap:24px;justify-content:center;padding:16px 24px 40px;max-width:1150px;margin:0 auto}
figure{margin:0;text-align:center} img{width:200px;height:200px} figcaption{font-weight:700;font-size:13px;margin-top:6px}
</style></head><body>
<h1>Water intake – daily goal progress</h1>
<p><a href="#" onclick="location.reload();return false">Replay animations</a></p>
<div class="grid" id="g"></div>
<script>
for(let i=0;i<=100;i+=10){const n=String(i).padStart(3,'0');
document.getElementById('g').insertAdjacentHTML('beforeend',`<figure><img src="water_intake_${n}.svg?${Date.now()}" alt="${i}%"><figcaption>water_intake_${n}.svg</figcaption></figure>`);}
</script></body></html>
